# LinkApp — example Nginx reverse proxy config for Hostinger / Ubuntu VPS.
# Place at /etc/nginx/sites-available/linkapp and symlink into sites-enabled.
#
#   sudo ln -s /etc/nginx/sites-available/linkapp /etc/nginx/sites-enabled/linkapp
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain SSL with Certbot:
#   sudo certbot --nginx -d domain.com -d www.domain.com

# Redirect www -> apex (optional, remove if not wanted)
server {
    listen 80;
    listen [::]:80;
    server_name www.domain.com;
    return 301 https://domain.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name domain.com;

    # Certbot will add the 443/SSL server block and redirect here automatically.
    # Until SSL is issued, this plain HTTP block serves the app directly.

    client_max_body_size 15m;

    # Uploaded media (served directly by the backend, but proxied through Nginx)
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Backend API — Node.js + Express on port 4000
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next.js static assets — long-lived cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else — Next.js frontend on port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
