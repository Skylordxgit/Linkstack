# LinkApp — single Netlify site serving the Next.js frontend (via the
# official Next.js Runtime plugin) and the Express API as one Netlify
# Function (backend/netlify/functions/api.ts, wrapping the same Express
# app that also runs standalone for local dev / any self-hosted fallback).

[build]
  base = "frontend"
  # Installs + generates the Prisma client for the ../backend package first
  # (the API function needs it at bundle time), then builds the Next.js app.
  command = "(cd ../backend && npm ci && npx prisma generate) && npm ci && npm run build"
  publish = ".next"
  functions = "../backend/netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  # Native/binary modules esbuild can't bundle — shipped as real node_modules
  # instead. @prisma/client + .prisma/client together are the generated
  # client and its query-engine binary.
  external_node_modules = ["@prisma/client", ".prisma/client", "sharp"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
