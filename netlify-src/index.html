<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signup Links</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Signup Links</a>
    <nav>
      <a href="/@admin">Public page</a>
      <a href="/admin">Admin</a>
    </nav>
  </header>

  <main>
    <section id="public-view" class="public-shell">
      <div class="profile">
        <img id="avatar" class="avatar" alt="" hidden>
        <h1 id="display-name">Signup Links</h1>
        <p id="bio">Loading links...</p>
      </div>
      <div id="links" class="links"></div>
    </section>

    <section id="admin-view" class="admin-shell" hidden>
      <div id="login-panel" class="panel">
        <h1>Admin login</h1>
        <form id="login-form" class="form">
          <label>
            Email
            <input id="login-email" name="email" type="email" autocomplete="username" required>
          </label>
          <label>
            Password
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button type="submit">Sign in</button>
          <p id="login-message" class="message"></p>
        </form>
      </div>

      <div id="dashboard-panel" hidden>
        <div class="dashboard-head">
          <div>
            <h1>Dashboard</h1>
            <p>Manage the public Signup Links page.</p>
          </div>
          <button id="logout-button" class="secondary" type="button">Sign out</button>
        </div>

        <div class="grid">
          <form id="profile-form" class="panel form">
            <h2>Profile</h2>
            <label>
              Display name
              <input id="profile-name" name="display_name" required>
            </label>
            <label>
              Bio
              <textarea id="profile-bio" name="bio" rows="4"></textarea>
            </label>
            <label>
              Avatar URL
              <input id="profile-avatar" name="avatar_url" type="url">
            </label>
            <button type="submit">Save profile</button>
          </form>

          <form id="link-form" class="panel form">
            <h2>Add link</h2>
            <label>
              Label
              <input id="link-label" name="label" required>
            </label>
            <label>
              URL
              <input id="link-url" name="url" type="url" required>
            </label>
            <button type="submit">Add link</button>
          </form>
        </div>

        <section class="panel">
          <h2>Links</h2>
          <div id="admin-links" class="admin-links"></div>
        </section>
      </div>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
