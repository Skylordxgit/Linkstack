services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: linkapp
      MYSQL_USER: linkapp
      MYSQL_PASSWORD: linkapp
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_this_root_password}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "linkapp", "-plinkapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://linkapp:linkapp@mysql:3306/linkapp
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_string}
      COOKIE_NAME: linkapp_session
      ADMIN_EMAIL: ${ADMIN_EMAIL:-you@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_this_password}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      UPLOAD_PATH: uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://backend:4000/api
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      COOKIE_NAME: linkapp_session
    ports:
      - "3000:3000"

volumes:
  dbdata:
  uploads:
