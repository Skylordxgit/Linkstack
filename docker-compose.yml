# Optional local/self-hosted stack. Not used for the Netlify + Supabase
# deployment (see README) — this is for local development against a
# containerized Postgres instead of Supabase, or for self-hosting the whole
# app outside Netlify (e.g. alongside the Hostinger VPS instructions).
# Media uploads still go to Supabase Storage either way (see backend/.env) —
# there is no local-disk fallback.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkapp
      POSTGRES_PASSWORD: linkapp
      POSTGRES_DB: linkapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # No connection pooler needed for a self-managed Postgres container —
      # DATABASE_URL and DIRECT_URL are the same connection.
      DATABASE_URL: postgresql://linkapp:linkapp@postgres:5432/linkapp?schema=public
      DIRECT_URL: postgresql://linkapp:linkapp@postgres:5432/linkapp?schema=public
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-media}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_string}
      COOKIE_NAME: linkapp_session
      ADMIN_EMAIL: ${ADMIN_EMAIL:-you@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_this_password}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://backend:4000/api
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      COOKIE_NAME: linkapp_session
    ports:
      - "3000:3000"

volumes:
  pgdata:
